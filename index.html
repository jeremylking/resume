<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<!-- Sets the theme before first paint to avoid a flash of the wrong theme.
     Intentionally inline (must run before CSS/paint, so it cannot be an
     external deferred script) and duplicated byte-for-byte on every page —
     keep all 6 copies identical if you ever touch this. -->
<script>
  (function () {
    var pref = localStorage.getItem('theme-preference') || 'auto';
    var theme = pref === 'auto'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : pref;
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
